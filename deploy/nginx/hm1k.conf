# Hash Master 1000 - Nginx Configuration

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=hm1k_limit:10m rate=10r/s;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL Configuration
    ssl_certificate /etc/ssl/certs/hm1k.crt;
    ssl_certificate_key /etc/ssl/private/hm1k.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # File upload limit (for large pwdump files)
    client_max_body_size 500M;
    client_body_timeout 300s;

    # Proxy timeouts (for long-running operations)
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Custom error pages for when the Flask app is unavailable
    error_page 502 503 504 /maintenance.html;

    # Serve the maintenance page directly from static files
    location = /maintenance.html {
        root /opt/hm1k/static;
        internal;
    }

    # Static files - served directly by Nginx
    location /static/ {
        alias /opt/hm1k/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";

        # Gzip static files
        gzip_static on;
    }

    # Favicon
    location /favicon.ico {
        alias /opt/hm1k/static/images/favicon.ico;
        expires 30d;
    }

    # Application proxy
    location / {
        # Rate limiting
        limit_req zone=hm1k_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Intercept error pages from upstream
        proxy_intercept_errors on;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:8443/api/health;
        access_log off;
    }
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}
