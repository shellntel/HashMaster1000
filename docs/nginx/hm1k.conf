# Nginx reverse proxy configuration for Hash Master 1000
#
# This configuration provides:
# - SSL/TLS termination with modern cipher suite
# - HTTP/2 support
# - WebSocket support (for future features)
# - Proper proxy headers for Flask
# - Security headers
# - Gzip compression (complementing flask-compress)
#
# Installation:
#   1. Copy this file to /etc/nginx/sites-available/hm1k
#   2. Create symlink: sudo ln -s /etc/nginx/sites-available/hm1k /etc/nginx/sites-enabled/
#   3. Test config: sudo nginx -t
#   4. Reload nginx: sudo systemctl reload nginx
#
# SSL Certificate paths - update these to match your cert location:
#   ssl_certificate /etc/ssl/certs/hm1k.crt;
#   ssl_certificate_key /etc/ssl/private/hm1k.key;

# Upstream for Gunicorn backend (HTTP only - nginx handles SSL)
upstream hm1k_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name hm1k.local;  # Update with your hostname

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hm1k.local;  # Update with your hostname

    # SSL Configuration
    ssl_certificate /etc/ssl/certs/hm1k.crt;
    ssl_certificate_key /etc/ssl/private/hm1k.key;

    # Modern SSL settings (TLS 1.2+)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL session settings
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling (enable if using CA-signed cert)
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS (uncomment after confirming HTTPS works)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Request size limits (increase for large file uploads)
    client_max_body_size 100M;
    client_body_timeout 300s;
    client_header_timeout 60s;

    # Proxy timeouts (extended for AAIA long-running analysis)
    proxy_connect_timeout 60s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;

    # Gzip compression (complementing flask-compress)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml application/atom+xml image/svg+xml;

    # Static files - serve directly from nginx for better performance
    location /static/ {
        alias /opt/hm1k/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";

        # Security headers for static files
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Favicon
    location /favicon.ico {
        alias /opt/hm1k/static/favicon.ico;
        expires 30d;
        access_log off;
    }

    # Main application proxy
    location / {
        proxy_pass http://hm1k_backend;
        proxy_http_version 1.1;

        # Required headers for Flask
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (for future features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://hm1k_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Access and error logs
    access_log /var/log/nginx/hm1k_access.log;
    error_log /var/log/nginx/hm1k_error.log;
}
