# HM1K Agent Configuration
# Copy this file to /etc/hm1k-agent/config.yaml and customize

# Server connection settings
server:
  # URL of the HM1K server (required)
  # Use IP address for reliability, or DNS name if configured
  url: "https://192.168.8.88"

  # JWT authentication token (set during registration)
  # Leave empty to use discovery mode
  token: ""

  # Verify SSL certificates (set to true if using proper CA-signed certificates)
  verify_ssl: false

# Agent identification
agent:
  # Unique agent ID (auto-generated if empty)
  id: ""

  # Human-readable name for this agent (optional, defaults to hostname)
  # Leave empty or omit to use the system hostname
  name: ""

  # Optional tags for organization
  tags:
    - "datacenter-1"
    - "gpu-rtx4090"

# Hashcat configuration
hashcat:
  # Path to hashcat binary
  # Common locations (in order of preference):
  #   /opt/hashcat/current/hashcat  - symlinked version (recommended)
  #   /opt/hashcat/hashcat          - direct install
  #   /usr/local/bin/hashcat        - manual install
  #   /usr/bin/hashcat              - package manager install
  # NOTE: Do NOT use ~/hashcat - ProtectHome=true prevents home directory access
  binary: "/opt/hashcat/current/hashcat"

  # Working directory for hashcat (temp files, etc.)
  workdir: "/var/lib/hm1k-agent/hashcat"

  # GPU device selection (empty = all devices)
  # Use 'hashcat -I' to list available devices
  devices: []

  # Workload profile (1=Low, 2=Default, 3=High, 4=Nightmare)
  # Higher values = faster but less responsive system
  workload_profile: 3

  # Optimized kernels for faster cracking (may reduce max password length)
  optimized_kernels: true

  # Additional hashcat arguments
  extra_args: []

# Resource cache settings
resources:
  # Directory for cached wordlists and rules
  cache_dir: "/var/lib/hm1k-agent/cache"

  # Directory for job-specific files
  jobs_dir: "/var/lib/hm1k-agent/jobs"

  # Directory for potfiles (cracked hashes)
  potfiles_dir: "/var/lib/hm1k-agent/potfiles"

  # Directory for hashcat session files
  sessions_dir: "/var/lib/hm1k-agent/sessions"

  # Data directory (offline buffer, logs)
  data_dir: "/var/lib/hm1k-agent/data"

  # Maximum cache size in gigabytes
  max_cache_size_gb: 50

  # Pre-fetch commonly used wordlists on startup
  prefetch: true

# Timing configuration
timing:
  # Heartbeat interval in seconds
  heartbeat_interval: 30

  # Status update interval in seconds (during active job)
  status_interval: 10

  # API request timeout in seconds
  api_timeout: 30

# Logging configuration
logging:
  # Log level: DEBUG, INFO, WARNING, ERROR
  level: "INFO"

  # Log file path (empty = stdout only)
  file: "/var/log/hm1k-agent/agent.log"

  # Maximum log file size in MB before rotation
  max_size_mb: 100

  # Number of rotated log files to keep
  backup_count: 5

# Local API server (for health checks and testing)
api:
  # Enable local API server
  enabled: true

  # Bind address (127.0.0.1 = localhost only, 0.0.0.0 = all interfaces)
  host: "127.0.0.1"

  # Port for local API
  port: 8787

  # Optional API key for authentication (leave empty to disable)
  # Required for job submission/control endpoints if set
  key: ""
