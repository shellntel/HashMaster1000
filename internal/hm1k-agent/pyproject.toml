[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hm1k-agent"
version = "0.1.25"
description = "Hashcat cracking agent for Hash Master 1000"
readme = "README.md"
license = "CC-BY-NC-4.0"
requires-python = ">=3.10"
authors = [
    { name = "Brian Judd", email = "bjudd@synercomm.com" }
]
keywords = ["hashcat", "password", "cracking", "agent", "distributed"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "pyjwt>=2.6.0",
    "sseclient-py>=1.7.2",
    "click>=8.0.0",
    "rich>=13.0.0",
    "flask>=3.0.0",
    "zstandard>=0.21.0",
    "py7zr>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
hm1k-agent = "hm1k_agent.cli:main"

[project.urls]
Homepage = "https://github.com/shellntel/hm1k"
Documentation = "https://github.com/shellntel/hm1k/tree/main/docs"
Repository = "https://github.com/shellntel/hm1k"

[tool.hatch.build.targets.wheel]
packages = ["src/hm1k_agent"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
