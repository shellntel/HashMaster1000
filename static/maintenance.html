<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hash Master 1000 - Maintenance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: url('/static/images/maintenance-bg.png') no-repeat center center;
            background-size: cover;
            background-color: #0a0a0a;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .message-box {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #00ff66;
            border-radius: 8px;
            padding: 40px 50px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.3),
                        inset 0 0 20px rgba(0, 255, 102, 0.05);
        }
        .status-icon {
            font-size: 48px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(0, 255, 102, 0.5));
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 16px;
            color: #00ff66;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
        }
        .message {
            font-size: 1rem;
            color: #cccccc;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .status-detail {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(0, 255, 102, 0.05);
            border: 1px solid rgba(0, 255, 102, 0.2);
            border-radius: 4px;
        }
        .retry-btn {
            display: inline-block;
            padding: 12px 35px;
            background: transparent;
            color: #00ff66;
            text-decoration: none;
            border: 2px solid #00ff66;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .retry-btn:hover {
            background: #00ff66;
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.5);
        }
        /* Pulse animation for the icon */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }
        /* Glow animation for the border */
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 30px rgba(0, 255, 102, 0.3), inset 0 0 20px rgba(0, 255, 102, 0.05); }
            50% { box-shadow: 0 0 40px rgba(0, 255, 102, 0.5), inset 0 0 30px rgba(0, 255, 102, 0.1); }
        }
        .message-box {
            animation: glow 3s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <div class="message-box">
            <div class="status-icon pulse">&#9881;</div>

            <h1>System Maintenance</h1>

            <p class="message">
                Hash Master 1000 is currently undergoing maintenance or is temporarily unavailable.
            </p>

            <div class="status-detail">
                The application may be updating, restarting, or experiencing temporary issues.
                This usually resolves within a few minutes.
            </div>

            <a href="/" class="retry-btn">&#8635; Try Again</a>
        </div>
    </div>
</body>
</html>
