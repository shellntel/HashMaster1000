<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Change Password - Hash Master 1000</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <script src="{{ url_for('static', filename='js/matrix.js') }}" defer></script>
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-logo">
            <div class="login-logo-text">
                <span class="login-logo-hash">Hash</span>
                <span class="login-logo-master">Master</span>
                <span class="login-logo-1000">1000</span>
            </div>
            <div class="login-logo-subtitle">CHANGE PASSWORD</div>
        </div>

        {% if force_change %}
        <div class="login-notice">
            You must change your password before continuing.
        </div>
        {% endif %}

        {% if error %}
        <div class="login-error">
            {{ error }}
        </div>
        {% endif %}

        <form action="{{ url_for('change_password') }}" method="POST" class="login-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="login-input-group">
                <label for="current_password">Current Password</label>
                <input
                    type="password"
                    id="current_password"
                    name="current_password"
                    placeholder="Enter current password"
                    autocomplete="current-password"
                    required
                />
            </div>
            <div class="login-input-group">
                <label for="new_password">New Password</label>
                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    placeholder="Enter new password (min 8 characters)"
                    autocomplete="new-password"
                    required
                    minlength="8"
                />
            </div>
            <div class="login-input-group">
                <label for="confirm_password">Confirm New Password</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    autocomplete="new-password"
                    required
                    minlength="8"
                />
            </div>
            <button type="submit" class="login-btn">
                <span class="login-btn-text">Change Password</span>
                <span class="login-btn-icon">&#8594;</span>
            </button>
        </form>

        {% if not force_change %}
        <div class="login-footer">
            <a href="{{ url_for('index') }}" class="login-link">Cancel and go back</a>
        </div>
        {% endif %}
    </div>
</body>
</html>
