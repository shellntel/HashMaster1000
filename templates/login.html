<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Login - Hash Master 1000</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
	<script src="{{ url_for('static', filename='js/matrix.js') }}" defer></script>
</head>
<body class="login-page">
	<div class="login-container">
		<!-- Modern CSS Logo -->
		<div class="login-logo">
			<div class="login-logo-text">
				<span class="login-logo-hash">Hash</span>
				<span class="login-logo-master">Master</span>
				<span class="login-logo-1000">1000</span>
			</div>
			<div class="login-logo-subtitle">PASSWORD & HASH ANALYZER</div>
		</div>

		<!-- Login Form -->
		<form action="{{ url_for('login') }}" method="POST" class="login-form">
			<div class="login-input-group">
				<label for="username">Username</label>
				<input
					type="text"
					id="username"
					name="username"
					placeholder="Enter your username"
					autocomplete="username"
					required
				/>
			</div>
			<div class="login-input-group">
				<label for="password">Password</label>
				<input
					type="password"
					id="password"
					name="password"
					placeholder="Enter your password"
					autocomplete="current-password"
					required
				/>
			</div>
			<button type="submit" class="login-btn">
				<span class="login-btn-text">Sign In</span>
				<span class="login-btn-icon">&#8594;</span>
			</button>
		</form>

		<!-- Version/Footer -->
		<div class="login-footer">
			<span>Secure Authentication Required</span>
		</div>
	</div>
</body>
</html>
